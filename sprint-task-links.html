<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sprint Task — Daily Tasks App</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F7F6F1;
    --paper-line: #DEDAD0;
    --ink: #22261F;
    --ink-soft: #6B6F63;
    --moss: #47624A;
    --moss-deep: #34492F;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    background: var(--paper);
    color: var(--ink);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 40px 20px;
  }

  .card {
    width: 100%;
    max-width: 480px;
  }

  header {
    border-bottom: 2px solid var(--ink);
    padding-bottom: 18px;
    margin-bottom: 28px;
  }

  h1 {
    font-family: 'Fraunces', serif;
    font-weight: 600;
    font-size: 34px;
    margin: 0 0 6px;
    letter-spacing: -0.01em;
  }

  p.tagline {
    margin: 0;
    color: var(--ink-soft);
    font-size: 14px;
  }

  .links {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  a.link-row {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 12px;
    padding: 16px 18px;
    border: 1.5px solid var(--paper-line);
    border-radius: 3px;
    text-decoration: none;
    color: var(--ink);
    background: #fff;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  a.link-row:hover {
    border-color: var(--moss);
    background: #FBFBF8;
  }

  .link-text {
    display: flex;
    flex-direction: column;
    gap: 2px;
  }

  .link-label {
    font-size: 15px;
    font-weight: 500;
  }

  .link-sub {
    font-size: 12px;
    color: var(--ink-soft);
  }

  .arrow {
    font-size: 16px;
    color: var(--moss);
    flex-shrink: 0;
  }

  .live-dot {
    display: inline-block;
    width: 7px;
    height: 7px;
    border-radius: 50%;
    background: var(--moss);
    margin-right: 6px;
  }

  footer {
    margin-top: 28px;
    font-size: 12px;
    color: var(--ink-soft);
  }
</style>
</head>
<body>
  <div class="card">
    <header>
      <h1>Sprint Task</h1>
      <p class="tagline">A daily task manager — add, complete, edit, and delete tasks from one page.</p>
    </header>

    <div class="links">
      <a class="link-row" href="https://sprint-task-plum.vercel.app/" target="_blank" rel="noopener">
        <div class="link-text">
          <span class="link-label"><span class="live-dot"></span>Open the app</span>
          <span class="link-sub">sprint-task-plum.vercel.app</span>
        </div>
        <span class="arrow">&#8594;</span>
      </a>

      <a class="link-row" href="https://github.com/Alokkumar-shgit/sprint-task" target="_blank" rel="noopener">
        <div class="link-text">
          <span class="link-label">View the source</span>
          <span class="link-sub">github.com/Alokkumar-shgit/sprint-task</span>
        </div>
        <span class="arrow">&#8594;</span>
      </a>
    </div>

    <footer>Built with HTML, CSS, and JavaScript.</footer>
  </div>
</body>
</html>
